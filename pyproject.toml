[project]
name = "copc_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.18",
    "duckdb>=1.5.5",
    "laspy>=2.7.0",
    "lazrs>=0.8.2",
    "numpy>=2.2.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "copc_pipeline"
registry_modules = [
    "copc_pipeline.components.*",
]


